<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Traitement Secondaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="card my-4">
    <div class="card-header bg-primary text-white">
      <h2>Traitement Secondaire - Lot #<span th:text="${batchId}"></span></h2>
    </div>
    <div class="card-body">
      <form th:action="@{'/secondary-processing/' + ${batchId}}" th:object="${form}" method="post">
        <!-- Heures de traitement -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Heure de début (HH:MM)</label>
            <input type="text" class="form-control" th:field="*{startTime}" pattern="[0-9]{2}:[0-9]{2}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Heure de fin (HH:MM)</label>
            <input type="text" class="form-control" th:field="*{endTime}" pattern="[0-9]{2}:[0-9]{2}" required>
          </div>
        </div>

        <!-- Huile brute -->
        <div class="mb-3">
          <label class="form-label">Quantité d'huile brute obtenue (L)</label>
          <input type="number" step="0.1" class="form-control" th:field="*{crudeOilQuantity}" required>
          <small class="text-muted">Stock actuel: <span th:text="${crudeOilStock}"></span> L</small>
        </div>

        <!-- Filtrage -->
        <div class="mb-3">
          <label class="form-label">Machine utilisée</label>
          <select class="form-select" th:field="*{filteringMachineId}" required>
            <option value="">Sélectionner...</option>
            <option th:each="machine : ${machines}"
                    th:value="${machine.id}"
                    th:text="${machine.name}"></option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Quantité d'huile filtrée (L)</label>
          <input type="number" step="0.1" class="form-control" th:field="*{filteredOilQuantity}" required>
          <small class="text-muted">Stock actuel: <span th:text="${filteredOilStock}"></span> L</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Opérateur filtre</label>
          <select class="form-select" th:field="*{filterOperatorId}" required>
            <option value="">Sélectionner...</option>
            <option th:each="operator : ${operators}"
                    th:value="${operator.id}"
                    th:text="${operator.fullName}"></option>
          </select>
        </div>

        <!-- Rendement -->
        <div class="mb-3">
          <label class="form-label">Rendement final cible (%)</label>
          <input type="number" step="0.1" class="form-control" th:field="*{targetYield}" required>
        </div>

        <!-- Commentaires -->
        <div class="mb-3">
          <label class="form-label">Commentaires</label>
          <textarea class="form-control" th:field="*{comments}" rows="3"></textarea>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
