<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Opérateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <h6 class="sidebar-heading px-3 mt-4 mb-1 text-muted">
                    <span th:text="${operator.fullName}"></span>
                    <small class="d-block" th:text="${operator.email}"></small>
                </h6>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="/operator/dashboard">
                            Mon Espace Opérateur
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/operator/stocks">
                            Stocks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            Déconnexion
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Tableau de Bord Opérateur</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#newBatchModal">
                        Nouveau Lot
                    </button>
                </div>
            </div>

            <!-- Current Batches -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Mes Lots en Cours</h5>
                </div>
                <div class="card-body">
                    <div th:if="${currentBatches.empty}" class="text-center text-muted py-4">
                        Aucun lot en cours
                    </div>
                    <div th:each="batch : ${currentBatches}" class="mb-3 border-bottom pb-2">
                        <h6 th:text="'Lot #' + ${batch.batchId}"></h6>
                        <small class="text-muted" th:text="${#dates.format(batch.startDate, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>
            </div>

            <!-- Completed Batches -->
            <div class="card">
                <div class="card-header">
                    <h5>Derniers Lots Terminés</h5>
                </div>
                <div class="card-body">
                    <div th:if="${completedBatches.empty}" class="text-center text-muted py-4">
                        Aucun lot terminé récemment
                    </div>
                    <div th:each="batch : ${completedBatches}" class="mb-3 border-bottom pb-2">
                        <h6 th:text="'Lot #' + ${batch.batchId}"></h6>
                        <small class="text-muted"
                               th:text="${#dates.format(batch.startDate, 'dd/MM/yyyy')} + ' - ' + ${#dates.format(batch.endDate, 'dd/MM/yyyy')}"></small>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- New Batch Modal -->
<div class="modal fade" id="newBatchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Création d'un Nouveau Lot</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/operator/create-batch}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">ID du Lot</label>
                        <input type="text" class="form-control" name="batchId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Opérateur principal</label>
                        <input type="text" class="form-control" th:value="${operator.fullName}" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Commencer le Lot</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
