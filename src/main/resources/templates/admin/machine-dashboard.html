<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Machines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar (identique à stock-dashboard) -->

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Liste des Machines</h1>
            </div>

            <!-- Tableau des machines -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Type</th>
                                <th>Statut</th>
                                <th>Performance</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="machine : ${machines}">
                                <td th:text="${machine.name}"></td>
                                <td th:text="${machine.type}"></td>
                                <td>
                                    <span th:if="${machine.status == 'En service'}" class="badge bg-success" th:text="${machine.status}"></span>
                                    <span th:if="${machine.status == 'Maintenance'}" class="badge bg-warning text-dark" th:text="${machine.status}"></span>
                                </td>
                                <td>
                                    <div class="progress">
                                        <div class="progress-bar" role="progressbar"
                                             th:style="'width: ' + ${machine.performance} + '%'"
                                             th:text="${machine.performance} + '%'"></div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Formulaire ajout machine -->
            <div class="card">
                <div class="card-header">
                    <h5>Ajouter une nouvelle machine</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/machines/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nom de la machine</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Type de machine</label>
                            <select class="form-select" name="type" required>
                                <option value="Pressage">Pressage</option>
                                <option value="Filtrage">Filtrage</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Statut</label>
                            <select class="form-select" name="status" required>
                                <option value="En service">En service</option>
                                <option value="Maintenance">Maintenance</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Performance (%)</label>
                            <input type="number" min="0" max="100" class="form-control" name="performance" required>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="button" class="btn btn-secondary me-md-2">Annuler</button>
                            <button type="submit" class="btn btn-primary">Ajouter</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
