<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Modifier utilisateur</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/users/update/{id}(id=${user.id})}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nom complet</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" th:field="*{phone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rôle</label>
                            <select class="form-select" th:field="*{role}" required>
                                <option value="ADMIN">Administrateur</option>
                                <option value="ANALYST">Analyste</option>
                                <option value="OPERATOR">Opérateur</option>
                            </select>
                        </div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div class="mb-3">
                            <label class="form-label">Département</label>
                            <select class="form-select" th:field="*{department}">
                                <option value="PRODUCTION">Production</option>
                                <option value="QUALITY">Qualité</option>
                                <option value="MAINTENANCE">Maintenance</option>
                                <option value="IT">IT</option>
                                <option value="HR">RH</option>
                                <option value="LOGISTICS">Logistique</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a href="/admin/users" class="btn btn-secondary">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
