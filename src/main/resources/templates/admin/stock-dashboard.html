<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Stocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/users">Utilisateurs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/stocks">Stocks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/machines">Machines</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Niveaux de Stock</h1>
            </div>

            <!-- Liste des mouvements -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Mouvements récents</h5>
                </div>
                <div class="card-body">
                    <div th:each="movement : ${movements}" class="mb-3 border-bottom pb-2">
                        <h6 th:text="${movement.productName}"></h6>
                        <div th:class="${movement.movementType == '+' ? 'text-success' : 'text-danger'}"
                             th:text="${movement.movementType} + ' ' + ${movement.quantity} + ' kg'"></div>
                        <small class="text-muted" th:text="${#dates.format(movement.date, 'dd/MM/yyyy à HH:mm')}"></small>
                        <p th:if="${movement.notes}" class="mt-1 fst-italic" th:text="'Note: ' + ${movement.notes}"></p>
                    </div>
                </div>
            </div>

            <!-- Formulaire nouveau mouvement -->
            <div class="card">
                <div class="card-header">
                    <h5>Nouveau mouvement</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/stocks/add-movement}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Produit</label>
                            <select class="form-select" name="productName" required>
                                <option value="Fruits d'argan">Fruits d'argan</option>
                                <option value="Amandes">Amandes</option>
                                <option value="Huile brute">Huile brute</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" name="movementType" required>
                                <option value="+">Entrée (+)</option>
                                <option value="-">Sortie (-)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantité (kg)</label>
                            <input type="number" step="0.01" class="form-control" name="quantity" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" name="notes"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
