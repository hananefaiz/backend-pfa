<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuration Système</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Paramètres Système</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/config/update}" method="post">
                <div class="mb-3">
                    <label class="form-label">Seuil d'alerte (%)</label>
                    <input type="number" class="form-control" name="value"
                           th:value="${config.settings['alertThreshold']}">
                    <input type="hidden" name="key" value="alertThreshold">
                </div>

                <div class="mb-3">
                    <label class="form-label">Fréquence de sauvegarde</label>
                    <select class="form-select" name="value">
                        <option th:selected="${config.settings['backupFrequency'] == 'Quotidienne'}" value="Quotidienne">Quotidienne</option>
                        <option th:selected="${config.settings['backupFrequency'] == 'Hebdomadaire'}" value="Hebdomadaire">Hebdomadaire</option>
                        <option th:selected="${config.settings['backupFrequency'] == 'Mensuelle'}" value="Mensuelle">Mensuelle</option>
                    </select>
                    <input type="hidden" name="key" value="backupFrequency">
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
