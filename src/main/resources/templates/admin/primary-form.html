<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Traitement Primaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card my-4">
        <div class="card-header bg-primary text-white">
            <h2>Traitement Primaire - Lot #<span th:text="${batchId}"></span></h2>
        </div>
        <div class="card-body">
            <form th:action="@{'/processing/primary/' + ${batchId}}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Quantité de fruits (kg)</label>
                        <input type="number" step="0.1" class="form-control" name="fruitQuantity" required>
                        <small class="text-muted">Stock disponible: <span th:text="${fruitStock}"></span> kg</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rendement cible (%)</label>
                        <input type="number" step="0.1" class="form-control" name="targetYield" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Opératrice(s) ayant travaillé</label>
                    <select class="form-select" name="operators" multiple>
                        <option th:each="op : ${operators}"
                                th:value="${op.id}"
                                th:text="${op.fullName}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantité d'amandes obtenues (kg)</label>
                    <input type="number" step="0.1" class="form-control" name="almondQuantity" required>
                    <small class="text-muted">Stock actuel: <span th:text="${almondStock}"></span> kg</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Commentaires</label>
                    <textarea class="form-control" name="comments" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary me-md-2">Enregistrer</button>
                    <button type="button" class="btn btn-success">Passer à l'étape suivante</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
