<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Traitement Secondaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="card my-4">
    <div class="card-header bg-primary text-white">
      <h2>Traitement Secondaire - Lot #<span th:text="${primary.batchId}"></span></h2>
    </div>
    <div class="card-body">
      <div class="alert alert-info mb-4">
        <h5>Rappel partie primaire:</h5>
        <ul>
          <li>Fruits traités: <span th:text="${primary.fruitQuantity}"></span> kg</li>
          <li>Amandes obtenues: <span th:text="${primary.almondQuantity}"></span> kg
            (<span th:text="${primary.actualYield}"></span>%)</li>
          <li>Rendement cible initial: <span th:text="${primary.targetYield}"></span>%</li>
        </ul>
      </div>

      <form th:action="@{'/processing/secondary/' + ${primary.batchId}}" method="post">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Quantité d'amandes utilisées (kg)</label>
            <input type="number" step="0.1" class="form-control" name="almondQuantityUsed" required>
            <small class="text-muted">Stock disponible: <span th:text="${almondStock}"></span> kg</small>
          </div>
          <div class="col-md-6">
            <label class="form-label">Machine utilisée</label>
            <select class="form-select" name="machineId" required>
              <option value="">Sélectionner...</option>
              <option th:each="machine : ${machines}"
                      th:value="${machine.id}"
                      th:text="${machine.name} + ' (' + ${machine.type} + ')'"></option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Opérateur machine</label>
          <select class="form-select" name="machineOperator" required>
            <option value="">Sélectionner...</option>
            <option th:each="op : ${operators}"
                    th:value="${op.id}"
                    th:text="${op.fullName}"></option>
          </select>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
