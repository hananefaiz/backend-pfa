<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/users">Utilisateurs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/stocks">Stocks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/profile">Profil</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
            <h1 class="mt-4">Gestion des Utilisateurs</h1>
            <div class="card mt-4">
                <div class="card-header">
                    <h5>Paramètres Système</h5>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <div th:each="user : ${users}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 th:text="${user.fullName}">Nom Utilisateur</h6>
                                    <small class="text-muted" th:text="${user.role} + ' - ' + ${user.department}">Rôle - Département</small><br>
                                    <small th:text="${user.email}">email@example.com</small><br>
                                    <small th:text="${user.phone}">0612345678</small><br>
                                    <small class="text-muted"
                                           th:text="'Dernière connexion: ' + ${#dates.format(user.lastLogin, 'dd/MM/yyyy')}">
                                        Dernière connexion: Date
                                    </small>
                                </div>
                                <div>
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">Modifier</a>
                                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')">
                                        Supprimer
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a href="/admin/users/add" class="btn btn-primary mt-3">+ Ajouter un utilisateur</a>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
